# Scrape roda local (Agendador de Tarefas no seu PC). O GitHub só dispara o geocode
# para preencher lat/lng das vagas já salvas no Supabase (Nominatim 1 req/s, demora).
name: Geocode Vagas

on:
  schedule:
    # A cada 1 hora (horário UTC)
    - cron: '0 * * * *'
  workflow_dispatch: # Permite execução manual

jobs:
  geocode:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Trigger Geocode
        run: |
          echo "Iniciando geocode às $(date) UTC"
          base_url="${SCRAPE_URL%/api/scrape}"
          response=$(curl -s -w "\n%{http_code}" -X POST \
            "${base_url}/api/geocode?secret=${{ secrets.SCRAPE_SECRET }}")
          http_code=$(echo "$response" | tail -n1)
          body=$(echo "$response" | sed '$d')
          echo "HTTP Status: $http_code"
          echo "Response: $body"
          if [ "$http_code" != "200" ]; then
            echo "Geocode falhou (vagas já estão no site, lat/lng podem ser preenchidos depois)"
            exit 0
          fi
          echo "Geocode concluído."
        env:
          SCRAPE_URL: ${{ secrets.SCRAPE_URL }}
          SCRAPE_SECRET: ${{ secrets.SCRAPE_SECRET }}